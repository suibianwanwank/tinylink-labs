<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"><title>ELF64 file, section table and section header fields</title><rect width="1200" height="1200" fill="#f8fafc"/>
<text x="40" y="38" font-family="Arial, sans-serif" font-size="25" fill="#172554">ELF64: file → section table → section header → payload</text>
<text x="40" y="70" font-family="Arial, sans-serif" font-size="17" fill="#172554">Example: 448 bytes. Intervals include start, exclude end. First row is to scale.</text>
<rect x="40.0" y="112" width="160.0" height="62" fill="#dbeafe" stroke="#64748b"/>
<text x="50.0" y="141" font-family="Arial, sans-serif" font-size="15" fill="#172554">ELF header</text>
<text x="40.0" y="103" font-family="Arial, sans-serif" font-size="14" fill="#172554">0</text>
<text x="45.0" y="198" font-family="Arial, sans-serif" font-size="14" fill="#172554">64 B</text>
<rect x="200.0" y="112" width="320.0" height="62" fill="#dcfce7" stroke="#64748b"/>
<text x="210.0" y="141" font-family="Arial, sans-serif" font-size="15" fill="#172554">.text</text>
<text x="200.0" y="103" font-family="Arial, sans-serif" font-size="14" fill="#172554">64</text>
<text x="205.0" y="198" font-family="Arial, sans-serif" font-size="14" fill="#172554">128 B</text>
<rect x="520.0" y="112" width="80.0" height="62" fill="#ede9fe" stroke="#64748b"/>
<text x="530.0" y="141" font-family="Arial, sans-serif" font-size="15" fill="#172554">names</text>
<text x="520.0" y="103" font-family="Arial, sans-serif" font-size="14" fill="#172554">192</text>
<text x="525.0" y="198" font-family="Arial, sans-serif" font-size="14" fill="#172554">32 B</text>
<rect x="600.0" y="112" width="80.0" height="62" fill="#e2e8f0" stroke="#64748b"/>
<text x="610.0" y="141" font-family="Arial, sans-serif" font-size="15" fill="#172554">pad</text>
<text x="600.0" y="103" font-family="Arial, sans-serif" font-size="14" fill="#172554">224</text>
<text x="605.0" y="198" font-family="Arial, sans-serif" font-size="14" fill="#172554">32 B</text>
<rect x="680.0" y="112" width="480.0" height="62" fill="#fef3c7" stroke="#64748b"/>
<text x="690.0" y="141" font-family="Arial, sans-serif" font-size="15" fill="#172554">Section header table</text>
<text x="680.0" y="103" font-family="Arial, sans-serif" font-size="14" fill="#172554">256</text>
<text x="685.0" y="198" font-family="Arial, sans-serif" font-size="14" fill="#172554">192 B</text>
<text x="1127" y="103" font-family="Arial, sans-serif" font-size="14" fill="#172554">448</text>
<text x="40" y="232" font-family="Arial, sans-serif" font-size="17" fill="#172554">names = .shstrtab (section names); pad = alignment padding. The green region is the .text payload.</text>
<text x="40" y="263" font-family="Arial, sans-serif" font-size="17" fill="#172554">e_shoff = 256     e_shentsize = 64     e_shnum = 3     e_shstrndx = 2</text>
<text x="40" y="310" font-family="Arial, sans-serif" font-size="21" fill="#172554">The same table expanded: each box is one entry, not another file</text>
<rect x="40" y="330" width="370" height="74" fill="#e2e8f0" stroke="#64748b"/>
<text x="50" y="359" font-family="Arial, sans-serif" font-size="15" fill="#172554">[0] SHT_NULL</text>
<text x="50" y="386" font-family="Arial, sans-serif" font-size="16" fill="#172554">file [256, 320) — 64 B</text>
<rect x="410" y="330" width="370" height="74" fill="#dcfce7" stroke="#64748b"/>
<text x="420" y="359" font-family="Arial, sans-serif" font-size="15" fill="#172554">[1] .text</text>
<text x="420" y="386" font-family="Arial, sans-serif" font-size="16" fill="#172554">file [320, 384) — 64 B</text>
<rect x="780" y="330" width="370" height="74" fill="#ede9fe" stroke="#64748b"/>
<text x="790" y="359" font-family="Arial, sans-serif" font-size="15" fill="#172554">[2] .shstrtab</text>
<text x="790" y="386" font-family="Arial, sans-serif" font-size="16" fill="#172554">file [384, 448) — 64 B</text>
<text x="40" y="442" font-family="Arial, sans-serif" font-size="16" fill="#172554">[1] sh_offset=64, sh_size=128 → input[64..192]     [2] sh_offset=192, sh_size=32 → input[192..224]</text>
<text x="40" y="488" font-family="Arial, sans-serif" font-size="21" fill="#172554">Complete layout of every ELF64 section header: 16 bytes per row, 64 bytes total</text>
<rect x="40" y="515" width="276" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="50" y="544" font-family="Arial, sans-serif" font-size="15" fill="#172554">+0  sh_name</text>
<text x="50" y="584" font-family="Arial, sans-serif" font-size="15" fill="#172554">4 bytes</text>
<rect x="316" y="515" width="276" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="326" y="544" font-family="Arial, sans-serif" font-size="15" fill="#172554">+4  sh_type</text>
<text x="326" y="584" font-family="Arial, sans-serif" font-size="15" fill="#172554">4 bytes</text>
<rect x="592" y="515" width="552" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="602" y="544" font-family="Arial, sans-serif" font-size="15" fill="#172554">+8  sh_flags</text>
<text x="602" y="584" font-family="Arial, sans-serif" font-size="15" fill="#172554">8 bytes</text>
<rect x="40" y="600" width="552" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="50" y="629" font-family="Arial, sans-serif" font-size="15" fill="#172554">+16  sh_addr</text>
<text x="50" y="669" font-family="Arial, sans-serif" font-size="15" fill="#172554">8 bytes</text>
<rect x="592" y="600" width="552" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="602" y="629" font-family="Arial, sans-serif" font-size="15" fill="#172554">+24  sh_offset</text>
<text x="602" y="669" font-family="Arial, sans-serif" font-size="15" fill="#172554">8 bytes</text>
<rect x="40" y="685" width="552" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="50" y="714" font-family="Arial, sans-serif" font-size="15" fill="#172554">+32  sh_size</text>
<text x="50" y="754" font-family="Arial, sans-serif" font-size="15" fill="#172554">8 bytes</text>
<rect x="592" y="685" width="276" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="602" y="714" font-family="Arial, sans-serif" font-size="15" fill="#172554">+40  sh_link</text>
<text x="602" y="754" font-family="Arial, sans-serif" font-size="15" fill="#172554">4 bytes</text>
<rect x="868" y="685" width="276" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="878" y="714" font-family="Arial, sans-serif" font-size="15" fill="#172554">+44  sh_info</text>
<text x="878" y="754" font-family="Arial, sans-serif" font-size="15" fill="#172554">4 bytes</text>
<rect x="40" y="770" width="552" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="50" y="799" font-family="Arial, sans-serif" font-size="15" fill="#172554">+48  sh_addralign</text>
<text x="50" y="839" font-family="Arial, sans-serif" font-size="15" fill="#172554">8 bytes</text>
<rect x="592" y="770" width="552" height="48" fill="#dbeafe" stroke="#64748b"/>
<text x="602" y="799" font-family="Arial, sans-serif" font-size="15" fill="#172554">+56  sh_entsize</text>
<text x="602" y="839" font-family="Arial, sans-serif" font-size="15" fill="#172554">8 bytes</text>
<text x="40" y="881" font-family="Arial, sans-serif" font-size="16" fill="#172554">Field width ≠ stored value: sh_size occupies 8 bytes; its value 128 describes a 128-byte payload.</text>
<text x="40" y="910" font-family="Arial, sans-serif" font-size="16" fill="#172554">The table need not be last; payload order may differ. SHT_NOBITS (e.g. .bss) has no file payload.</text>
<text x="40" y="939" font-family="Arial, sans-serif" font-size="16" fill="#172554">sh_name is a byte offset inside the name table; e_shstrndx selects that table’s header entry.</text>
</svg>